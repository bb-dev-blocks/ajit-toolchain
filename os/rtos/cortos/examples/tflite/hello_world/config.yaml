# yaml configuration file for linker/loader of Co-RTOS

Cores: 1
ThreadsPerCore: 1
TotalMemoryInKB: 8192
LogLevel: NONE

ProgramThreads:
  - CortosInitCalls:
      - main
    StackSizeInBytes: 65536

ExtraCc:
  - tflite-micro/tensorflow/lite/micro/examples/hello_world/hello_world_test.cc
  - tflite-micro/gen/ajit_sparc_default_gcc/genfiles/tensorflow/lite/micro/examples/hello_world/models/hello_world_float_model_data.cc
  - tflite-micro/gen/ajit_sparc_default_gcc/genfiles/tensorflow/lite/micro/examples/hello_world/models/hello_world_int8_model_data.cc
  - os/rtos/cortos/examples/tflite/cxxstub.cc

ExtraIncludes:
  - tflite-micro
  - tflite-micro/gen/ajit_sparc_default_gcc/genfiles
  - tflite-micro/tensorflow/lite/micro/tools/make/downloads
  - tflite-micro/tensorflow/lite/micro/tools/make/downloads/gemmlowp
  - tflite-micro/tensorflow/lite/micro/tools/make/downloads/flatbuffers/include
  - tflite-micro/tensorflow/lite/micro/tools/make/downloads/kissfft
  - tflite-micro/tensorflow/lite/micro/tools/make/downloads/ruy

ExtraLibDirs:
  - tflite-micro/gen/ajit_sparc_default_gcc/lib
